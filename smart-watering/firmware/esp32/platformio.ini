; Smart Watering ESP32 firmware.
; This project sends device discovery heartbeats and moisture data to the FastAPI backend.

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Display libraries for the SPI TFT moisture status screen.
lib_deps =
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit GC9A01A
  bblanchon/ArduinoJson@^7.0.0
