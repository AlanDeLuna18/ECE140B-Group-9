<!DOCTYPE html>
<html>
<head><title>Plant Pal - Dashboard</title></head>
<body>
    <h1>Welcome, {{ username }}</h1>
    <form method="post" action="/logout">
        <button type="submit">Sign Out</button>
    </form>
 
    <hr>
 
    <h2>Register a Plant</h2>
    <form id="create-plant-form">
        <input name="name" placeholder="Plant name" required>
        <br><br>
        <label>Water every
            <input name="watering_interval_hours" type="number" min="1" placeholder="e.g. 12" required>
            hours
        </label>
        <br><br>
        <button type="submit">Add Plant</button>
    </form>
 
    <h2>Your Plants</h2>
    <div id="plants"></div>
 
    <script>
        async function loadPlants() {
            const res = await fetch("/plants");
            const plants = await res.json();
            const container = document.getElementById("plants");
            container.innerHTML = "";
            if (plants.length === 0) {
                container.innerHTML = "<p>No plants yet — add one above!</p>";
                return;
            }
            plants.forEach(plant => {
                const div = document.createElement("div");
                div.style.border = "1px solid #ccc";
                div.style.padding = "8px";
                div.style.marginBottom = "8px";
                div.innerHTML = `
                    <strong>${plant.name}</strong>
                    <p>Waters every <strong>${plant.watering_interval_hours}</strong> hour(s)</p>
                    <button onclick="deletePlant(${plant.id})">Remove</button>
                `;
                container.appendChild(div);
            });
        }
 
        document.getElementById("create-plant-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const name = form.name.value;
            const watering_interval_hours = parseInt(form.watering_interval_hours.value);
            const res = await fetch("/plants", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name, watering_interval_hours}),
            });
            if (res.ok) {
                form.reset();
                loadPlants();
            } else {
                const err = await res.json();
                alert(err.detail || "Error adding plant");
            }
        });
 
        async function deletePlant(id) {
            const res = await fetch(`/plants/${id}`, {method: "DELETE"});
            if (res.ok) {
                loadPlants();
            } else {
                const err = await res.json();
                alert(err.detail || "Error removing plant");
            }
        }
 
        loadPlants();
    </script>
</body>
</html>
